<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rescate en el Polo Sur Lunar</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1026; }
    #juego { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; } /* pixeles nítidos */
    /* En un teléfono en vertical el juego se ve muy chico: se pide girarlo */
    #girar { display: none; }
    @media (orientation: portrait) and (max-width: 820px) {
      #girar { display: flex; position: fixed; inset: 0; z-index: 20; align-items: center; justify-content: center;
               flex-direction: column; gap: 12px; background: #0b1026; color: #ffd45c; font: 20px monospace; text-align: center; padding: 16px; }
      #girar span { font-size: 48px; }
    }
  </style>
  <!-- Phaser 3.80.1: copia local (funciona sin internet); si falta, se usa el CDN -->
  <script src="lib/phaser.min.js"></script>
  <script>window.Phaser || document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>');</script>
</head>
<body>
  <div id="juego"></div>
  <div id="girar"><span>↻</span>Gira tu teléfono para jugar</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
